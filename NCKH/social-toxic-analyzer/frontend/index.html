<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lăng Kính — Phân tích hành vi mạng xã hội</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #F7F5F0;
    --panel: #FFFFFF;
    --ink: #1E2A30;
    --ink-soft: #5A6B71;
    --line: #DFDACD;
    --accent: #2D6A6A;
    --accent-soft: #E4EFEC;
    --warn: #C97A2B;
    --warn-soft: #FBEEE1;
    --danger: #AE3B45;
    --danger-soft: #F7E5E4;
    --ok: #4C7A56;
    --ok-soft: #E9F1E9;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;}
  .serif{font-family:'Source Serif 4', serif;}
  #root{min-height:100vh;}
  .app{max-width:1080px;margin:0 auto;padding:40px 24px 80px;}
  .header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:24px;margin-bottom:32px;}
  .header h1{font-size:32px;font-weight:600;margin:0 0 6px;letter-spacing:-0.01em;}
  .header p{margin:0;color:var(--ink-soft);font-size:14.5px;max-width:520px;line-height:1.5;}
  .tabs{display:flex;gap:4px;margin-bottom:28px;border-bottom:1px solid var(--line);}
  .tab{padding:10px 4px;margin-right:24px;background:none;border:none;font-family:'Inter';font-size:14.5px;font-weight:500;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;position:relative;top:1px;}
  .tab.active{color:var(--ink);border-bottom-color:var(--accent);}
  .stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:32px;}
  .stat{background:var(--panel);border:1px solid var(--line);padding:18px 20px;}
  .stat .label{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;}
  .stat .value{font-size:26px;font-weight:600;font-family:'Source Serif 4';}
  textarea{width:100%;min-height:130px;border:1px solid var(--line);background:var(--panel);padding:14px;font-family:'Inter';font-size:14.5px;color:var(--ink);resize:vertical;line-height:1.5;}
  textarea:focus{outline:none;border-color:var(--accent);}
  .btn{background:var(--ink);color:#fff;border:none;padding:11px 22px;font-size:14px;font-weight:500;cursor:pointer;font-family:'Inter';}
  .btn:hover{background:#0f1719;}
  .btn:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-outline{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn-outline:hover{border-color:var(--ink);}
  .field-row{display:flex;gap:10px;margin-top:10px;}
  input[type=text]{flex:1;border:1px solid var(--line);padding:10px 12px;font-family:'Inter';font-size:14px;background:var(--panel);}
  input[type=text]:focus{outline:none;border-color:var(--accent);}
  .result-card{margin-top:24px;border:1px solid var(--line);background:var(--panel);}
  .result-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);}
  .severity-pill{font-size:12.5px;font-weight:600;padding:5px 12px;border-radius:2px;}
  .cat-list{padding:16px 20px;display:flex;flex-direction:column;gap:10px;}
  .cat-item{display:flex;justify-content:space-between;align-items:center;font-size:14px;}
  .cat-item .terms{color:var(--ink-soft);font-size:13px;margin-top:2px;}
  .risk-banner{background:var(--danger-soft);color:var(--danger);border-left:3px solid var(--danger);padding:12px 16px;font-size:13.5px;margin:0 20px 16px;line-height:1.5;}
  .drop-zone{border:1px dashed var(--line);background:var(--panel);padding:36px 20px;text-align:center;color:var(--ink-soft);font-size:14px;cursor:pointer;}
  .drop-zone.drag{border-color:var(--accent);background:var(--accent-soft);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink-soft);font-weight:500;font-size:12.5px;}
  td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;}
  .charts-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px;}
  .chart-box{background:var(--panel);border:1px solid var(--line);padding:18px;}
  .chart-box h3{margin:0 0 14px;font-size:14px;font-weight:600;font-family:'Inter';}
  .empty{color:var(--ink-soft);font-size:14px;padding:40px 0;text-align:center;}
  .note{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
  @media (max-width:720px){
    .stat-row{grid-template-columns:repeat(2,1fr);}
    .charts-grid{grid-template-columns:1fr;}
  }
</style>
</head>
